{% extends "base.html" %}

{% block content %}

<div class="workspace-header">
    <div>
        <p class="eyebrow"><i class="fa-solid fa-file-shield"></i> Report Intake</p>
        <h1>Intelligence Assessment Generator</h1>
        <p class="subtitle">Enter a Case ID to generate an intelligence assessment report with core findings</p>
    </div>
</div>

<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h3><i class="fa-solid fa-gears"></i> Assessment Engine</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Active Case File ID</label>
                    <input
                        type="text"
                        name="case_id"
                        placeholder="e.g. CASE001"
                        required
                    >
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 15px;">
                    <i class="fa-solid fa-arrows-spin"></i> Generate Intelligence Assessment
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
