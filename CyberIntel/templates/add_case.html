{% extends "base.html" %}

{% block content %}

<div class="workspace-header">
    <div>
        <h1>Create New Case File</h1>
    </div>
    <div class="workspace-actions">
        <a href="/cases" class="btn btn-outline"><i class="fa-solid fa-briefcase"></i> View All Cases</a>
    </div>
</div>

<div style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h3>Case Profile Record</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="form-group">
                    <label>Case File Name</label>
                    <input type="text" name="case_name" placeholder="e.g. UPI Phishing Syndicate" required>
                </div>

                <div class="form-group">
                    <label>Case Type Classification</label>
                    <input type="text" name="case_type" placeholder="e.g. Financial Fraud / Loan App Scam" required>
                </div>

                <div class="form-group">
                    <label>Assigned Investigating Officer</label>
                    <input type="text" name="investigator" placeholder="Investigating Officer name" required>
                </div>

                <div class="form-group">
                    <label>Initial File Status</label>
                    <select name="status">
                        <option value="Open">Open</option>
                        <option value="Under Investigation">Under Investigation</option>
                        <option value="Closed">Closed</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-folder-plus"></i> Register Case File
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
